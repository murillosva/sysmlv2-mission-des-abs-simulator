name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Test against the pinned reference environment (the one the published
      # artifacts were verified with), not the latest releases: the bit-exact
      # regression fixtures embed library versions in the files they hash.
      - name: Install the pinned reference environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check src tests

      - name: Mypy type-check
        run: mypy src

      # Informational, not a gate: prints the 20-seed regression ruler on this
      # platform, to compare with the values measured on the reference platform
      # (docs/reproducibility.md). Floating-point results can differ in the
      # last digits between operating systems.
      - name: Regression ruler (informational)
        run: python scripts/batch_seeds.py --seeds 20
        continue-on-error: true

      - name: Pytest unit + property
        run: |
          pytest tests/unit tests/property -v --cov=cuas_sim --cov-report=term-missing --cov-fail-under=60

      - name: Pytest smoke
        run: pytest tests/smoke -v

      # Promoted out of the nightly-only tier (2026-07-31). The Miranda (2025)
      # adherence batch runs in ~5 s now that the oracle shares one 200 000-draw
      # fixture with scripts/miranda_adherence_audit.py, and it guards numbers
      # the dissertation publishes — cheap enough to gate every PR.
      # Assertions are tolerance BANDS, not exact values, so it is
      # platform-independent.
      - name: Pytest statistical
        run: pytest tests/statistical -v
