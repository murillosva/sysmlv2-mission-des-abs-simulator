# Border-sector definitions for the 27-sector Amazon-strip polygon.
#
# Brazil-Colombia + Brazil-Peru border within the AoO, sectors 1–27 (N→S).
# Sector 1 starts at the AoO clip line (lat 1.800000), NOT at the BR-CO-VE
# tripoint; sector 27 ends 13.58 km short of the BR-PE-BO tripoint (the
# uncovered southern residue of the 2 713.58 km source polyline).
#
# SOURCE
# ──────
# Coordinates digitised from Natural Earth 50m (nvkelso/natural-earth-vector).
# Methodology adapted from Miranda (2025), ITA.
# Sectors do NOT correspond directly to sectors 28-50 of the original thesis.
#
# STOCHASTIC PARAMS (Miranda 2025 adapted)
# ────────────────────────────────────────
#   sector_distribution: normal
#   mu_sector:    14.0
#   sigma_sector:  4.3333   (coverage P=0.997 ≈ ±3σ spans ~26 sectors)
#
# To use this file: copy the border_sectors block into your main mission config.

border_sectors:

  # ── Brazil-Colombia border (sectors 1–14, N→S) ──────────────────────────
