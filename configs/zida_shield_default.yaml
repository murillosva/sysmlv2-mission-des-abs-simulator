# ── AoR → sector mapping (geographic, N→S) ───────────────────────────
# Derived from CAP midpoint boundaries: AoR-k is served by A-29-k at CAP-k.
# CAP-6 is northernmost (+0.43°N); CAP-1 is southernmost (-10.3°S).
# Midpoints between adjacent CAPs define the AoR latitudinal boundaries.
# Matches the Python _default_aor_to_sectors() in config.py, realigned N→S by
# Spec 030 FR-17 (it used to be geographically reversed).
aor_to_sectors:
  AoR-6: [1, 2, 3, 4, 5, 6, 7]     # lat_mid > -0.89° (near CAP-6, +0.43°N)
  AoR-5: [8, 9, 10]                  # lat_mid ∈ (-3.45°, -0.89°)
  AoR-4: [11, 12, 13, 14, 15]       # lat_mid ∈ (-5.34°, -3.45°)
  AoR-3: [16, 17]                    # lat_mid ∈ (-7.35°, -5.34°)
  AoR-2: [18, 19, 20, 21]           # lat_mid ∈ (-9.50°, -7.35°)
  AoR-1: [22, 23, 24, 25, 26, 27]  # lat_mid < -9.50° (near CAP-1, -10.3°S)

# ── UAS archetypes ────────────────────────────────────────────────────
uas_archetype_p_mr: 0.5   # P(multi-rotor) — uniform random draw

# ── Aircraft ──────────────────────────────────────────────────────────
a29_cruise_speed_mps: 144.0      # ~280 kn
a29_endurance_s: 18720.0          # 5.2 h × 3600 s

# ── Tracking (baseline) ──────────────────────────────────────────────
baseline_update_interval_s: [5.0, 60.0]
baseline_max_acquisition_m: 13000.0   # 13 km — naked-eye+VHF

# ── Tracking (modernized) ────────────────────────────────────────────
modernized_update_interval_s: [1.0, 10.0]
modernized_eoir_min_m: 14000.0
modernized_eoir_max_m: 20000.0        # 20 km — Star SAFIRE II + M3AR
modernized_eoir_accuracy_m: 5.0
modernized_track_p_fw: 1.0
modernized_track_p_mr: 0.2

# ── Weapon ────────────────────────────────────────────────────────────
baseline_envelope_m: [500.0, 2000.0]    # SBAT-70
modernized_envelope_m: [2000.0, 14000.0] # APKWS
p_hit_at_min_range: 0.80
dimensional_penalty_mr: 0.5
dimensional_penalty_fw: 1.0

# ── Mission timeline ──────────────────────────────────────────────────
t_pea_start_s: 9180.0      # T+153 min, synchronized across A-29s

# ── Simulation control ────────────────────────────────────────────────
skip_pre_pea: false
clip_moe1_to_01: true       # Spec 025 Q-3a — MOE-1 clamped to [0,1] (Eq. 3.5)
log_level: INFO
