# ─── Default configuration for the Continental ZIDA Shield Operation ────
#
# This file deliberately re-states many of the Python defaults so that a
# casual user editing it gets a complete view of the parameter space. The
# precedence is SysML > YAML > Python defaults: the SysML model under sysml/
# (if available) is applied on top of this file, so it prevails in the fields
# it supplies, and editing one of those fields here has no effect while the
# model is loaded. Any other line you delete here falls back to the Python
# defaults in cuas_sim.config.

# ── Arrival rate ──────────────────────────────────────────────────────
# Default: 6 UAS / hour. Override here or via --lambda on the CLI.
lambda_per_sec: 0.001666667   # ≈ 6 per hour

# ── Geographic ────────────────────────────────────────────────────────
aoo_centroid_lat: -5.0
aoo_centroid_lon: -68.0
zida_boundary_nmi: 80.0

# ── Border polygon (sectors 1-27, BR-CO + BR-PE border within the AoO) ────
# Source polyline: Natural Earth 50m (nvkelso/natural-earth-vector), BR∩CO and
# BR∩PE intersections clipped to the AoO box (1.80N..12.50S, 76W..60W) and
# ordered N→S. It spans 2 713.58 km; resampling every 100 km of geodesic ARC
# yields these 27 sectors (2 700.00 km), leaving a 13.58 km residue (0.50 %)
# uncovered at the southern end.
#   * sector 1 starts at the AoO clip line (lat 1.800000), NOT at the BR-CO-VE
#     tripoint — ~278 km of BR-CO border north of it are outside the polygon;
#   * sector 27 ends 13.58 km short of the BR-PE-BO tripoint (the residue).
# Traversal MUST stay N→S: `az - 90 deg` is the inward perpendicular only under
# that orientation, and BorderPolygon.__init__ enforces it (Spec 030 FR-16).
# Methodology adapted from Miranda (2025). Indices do not match original thesis.
# `arc` blocks are generated by scripts/gen_arc_block.py — do NOT hand-edit.
sector_min: 1
sector_max: 27
sector_mu: 14.0
sector_sigma: 4.333333333333333   # (N-1)/6 full precision (Spec 030 FR-9a)
heading_perpendicular_deviation_deg: 15.0

