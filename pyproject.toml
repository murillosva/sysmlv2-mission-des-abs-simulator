[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuas-sim"
version = "1.0.0"
description = "Paired discrete-event + agent-based simulator configured from a SysML v2 mission model (Continental ZIDA Shield Operation, A-29 Super Tucano C-UAS), companion artifact to the MODELSWARD 2027 paper 'From MBSE Mission Model to Executable Architecture: An Exploration of Hybrid Simulation in Defense'"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

authors = [
  { name = "Murillo S. Szvaticsek", email = "szvaticsek@ita.br" },
]

keywords = [
  "SysML v2",
  "MBSE",
  "mission engineering",
  "hybrid simulation",
  "discrete-event simulation",
  "agent-based modeling",
  "model transformation",
  "design of experiments",
  "C-UAS",
  "A-29",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
  "simpy>=4.1.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyproj>=3.6",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "typer>=0.12",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6.92",
  "ruff>=0.15,<0.16",
  "mypy>=1.8",
  "types-PyYAML",
]
# Statistical analysis layer (Specs 026-029). Not a simulation-runtime
# dependency: install only to run `cuas-sim analysis stats`/`predict`/`report`
# and the analysis test suite. scikit-learn = BSD-3-Clause, scikit-posthocs =
# MIT, jinja2 = BSD-3-Clause (all permissive). jinja2 renders the HTML report
# (lazy import in reporting.py). pingouin (GPL-3.0) is deliberately excluded.
analysis = [
  "scikit-learn>=1.3",
  "scikit-posthocs>=0.9",
  "jinja2>=3.1",
]
# Computational-cost measurement (scripts/bench_cost.py). psutil = BSD-3-Clause.
bench = [
  "psutil>=7.2",
]

[project.scripts]
cuas-sim = "cuas_sim.cli:app"

[project.urls]
Repository = "https://github.com/murillosva/sysmlv2-mission-des-abs-simulator"
Issues = "https://github.com/murillosva/sysmlv2-mission-des-abs-simulator/issues"
"Model generator (prior work)" = "https://github.com/murillosva/sysmlv2-mission-multi-agent-system"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuas_sim = ["py.typed"]

# ─── Tooling ───────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "statistical: Monte Carlo adherence/regression tests (in standard CI since 2026-07-31)",
  "smoke: end-to-end smoke tests of the CLI",
  "viz: visualisation/animation oracle tests (Spec 019)",
]

[tool.coverage.run]
branch = true
source = ["src/cuas_sim"]
omit = ["src/cuas_sim/viz/*", "src/cuas_sim/cli.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# E501: line length (we set 100, occasional overshoot is OK)
# N802/N803/N806: math-style symbols (P_hit, MOE_1, etc.)
# RUF001/RUF002/RUF003: en-dash, minus sign and multiplication sign are intentional
#   in equation strings/docstrings/comments and legend labels (e.g. "gain x cost")
ignore = ["E501", "N802", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# E402: several test modules place the module docstring after `from __future__
#   import annotations`, so imports trail a string statement. Harmless in tests.
"tests/**" = ["B", "N", "E402"]
# Typer requires typer.Option in argument defaults
"src/cuas_sim/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_decorators = false  # typer decorators
plugins = []

[[tool.mypy.overrides]]
module = ["simpy.*", "pyproj.*", "matplotlib.*", "scipy.*", "pandas.*", "sklearn.*", "scikit_posthocs.*", "jinja2.*"]
ignore_missing_imports = true
